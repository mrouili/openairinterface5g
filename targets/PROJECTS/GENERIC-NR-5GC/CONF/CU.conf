Active_gNBs = ( "gNB-Eurecom-CU");
# Asn1_verbosity, choice in: none, info, annoying
Asn1_verbosity = "none";
Num_Threads_PUSCH = 8;
# command: sudo ./nr-softmodem -O ../../../targets/PROJECTS/GENERIC-NR-5GC/CONF/CU_med.conf --sa
# arp command for DU on hpc3: sudo ip neigh add 192.168.44.13 lladdr a0:36:9f:eb:2a:88 dev enp1s0 nud permanent 
#open5gs core is on cn203
gNBs =
(
 {
    ////////// Identification parameters:
    gNB_ID = 0xe00;

#     cell_type =  "CELL_MACRO_GNB";

    gNB_name  =  "gNB-Eurecom-CU";

    // Tracking area code, 0x0000 and 0xfffe are reserved values
    tracking_area_code  =  1;
    plmn_list = (
      { mcc = 001; 
        mnc = 01; 
        mnc_length = 2; 
        snssaiList = (
          { 
            sst = 1; 
            sd = 000001; 
          },
          { 
            sst = 2; 
            sd = 000002; 
          }
          );
      }
      );

    nr_cellid = 12345678L;
    

    tr_s_preference = "f1";

    # local_s_if_name = "enp1s0";
    local_s_address = "127.0.0.4";
    remote_s_address = "0.0.0.0";
    local_s_portc   = 501;
    local_s_portd   = 2153;
    remote_s_portc  = 500;
    remote_s_portd  = 2153;

    # ------- SCTP definitions
    SCTP :
    {
        # Number of streams to use in input/output
        SCTP_INSTREAMS  = 2;
        SCTP_OUTSTREAMS = 2;
    };


    ////////// AMF parameters:
    amf_ip_address      = ( { 
                              #ipv4       = "129.97.168.43";
                              ipv4       = "10.10.3.200";  
                             # ipv4       = "192.168.70.132";
                             # ipv4       = "129.97.168.161";
                              ipv6       = "192:168:30::17";
                              active     = "yes";
                              preference = "ipv4";
                            }
                          );
    
    NETWORK_INTERFACES :
    {

        #GNB_INTERFACE_NAME_FOR_NG_AMF            = "eno1";
        #GNB_IPV4_ADDRESS_FOR_NG_AMF              = "129.97.168.100";
        GNB_INTERFACE_NAME_FOR_NG_AMF            = "n3br";
        GNB_IPV4_ADDRESS_FOR_NG_AMF              = "10.10.3.240";  #"10.10.3.240";
        GNB_INTERFACE_NAME_FOR_NGU               = "n3br";
        GNB_IPV4_ADDRESS_FOR_NGU                 = "10.10.3.240";  #"10.10.3.240";
        GNB_PORT_FOR_S1U                         = 2152; # Spec 2152
    };
  }
);

